<title>Agent Control Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: command bar (role, log sources) over tabbed workspace. Console tab = incident cards pinned above a live event feed. */
:root{--bg:#f3f6f6;--panel:#ffffff;--panel2:#e9efef;--line:#d6dfe0;--fg:#13201f;--muted:#566866;--accent:#0b7a85;--accent-fg:#ffffff;--ok:#2a7d52;--warn:#a96a0b;--bad:#b83228;--ok-bg:#e0f2e8;--warn-bg:#fcf0d9;--bad-bg:#fbe8e5;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--sans:'Schibsted Grotesk',system-ui,-apple-system,Segoe UI,sans-serif;--r:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1314;--panel:#121c1e;--panel2:#182628;--line:#263639;--fg:#e3eeed;--muted:#8da2a0;--accent:#3cbfc9;--accent-fg:#04191b;--ok:#5cc58f;--warn:#e0a643;--bad:#f0746a;--ok-bg:#12261c;--warn-bg:#2c2210;--bad-bg:#2e1715;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1314;--panel:#121c1e;--panel2:#182628;--line:#263639;--fg:#e3eeed;--muted:#8da2a0;--accent:#3cbfc9;--accent-fg:#04191b;--ok:#5cc58f;--warn:#e0a643;--bad:#f0746a;--ok-bg:#12261c;--warn-bg:#2c2210;--bad-bg:#2e1715;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin-inline:auto}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:16px 0 12px}
.bar h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.bar .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.ctl label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.sel,.inp{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 11px;font-size:12.5px;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:16px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent);font-weight:500}
.badge{display:inline-block;min-width:18px;text-align:center;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;padding:0 6px;margin-left:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi.bad .v{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600}
.muted{color:var(--muted)}.small{font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tool{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 11px;font-size:13px}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:500}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tag{font-size:12px;background:var(--panel2);border-radius:4px;padding:1px 7px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:10px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.meter{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.hot{background:var(--bad)}
.inc{border:1px solid var(--bad);background:var(--bad-bg);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.inc.done{border-color:var(--line);background:var(--panel);opacity:.75}
.inc code,.mono{font-family:var(--mono);font-size:12.5px}
.guard{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:10px}
.guard fieldset{border:1px solid var(--line);border-radius:var(--r);margin:0;padding:10px 12px;min-width:0}
.guard legend{font-weight:600;font-size:13px;padding:0 4px}
.guard label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;margin-top:6px}
.guard input[type=number]{width:64px}
details.card>summary{cursor:pointer;font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px}
td.wrap{white-space:normal;min-width:180px}
tr:last-child td{border-bottom:0}
.log td{font-family:var(--mono);font-size:12.5px}
.log tr.error td:nth-child(5){color:var(--bad)}
.log tr.blocked td:nth-child(5){color:var(--warn)}
.log tr.flag{background:var(--bad-bg)}
.r{text-align:right}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.note{background:var(--warn-bg);color:var(--fg);border-radius:var(--r);padding:8px 12px;margin-bottom:12px;font-size:13px}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.18);z-index:30;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.sheet h2{margin:0 0 12px;font-size:17px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.f>span{font-size:12.5px;color:var(--muted)}
.f .inp,.f textarea{width:100%}
.opts{display:flex;flex-wrap:wrap;gap:6px 12px}
.opts label{display:flex;align-items:center;gap:5px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:40;max-width:90%}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.dot.off{background:var(--muted)}
pre.code{background:var(--panel2);border-radius:6px;padding:10px;overflow:auto;font-family:var(--mono);font-size:12px;margin:8px 0}
.idlist{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.idpill{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-family:var(--mono);font-size:12px}
.idpill button{background:none;border:0;color:var(--muted);padding:0 2px;font-size:14px;line-height:1}
.idpill button:hover{color:var(--bad)}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline;font-size:12.5px}
@media (prefers-reduced-motion:no-preference){.inc:not(.done){animation:pulse 1.6s ease-out 1}@keyframes pulse{from{box-shadow:0 0 0 0 var(--bad)}to{box-shadow:0 0 0 10px transparent}}}
</style>

<div class="wrap">
  <div class="bar">
    <div><h1>Agent Control Room</h1><div class="sub" id="sub">Agents, people, departments, connectors and loop protection in one place.</div></div>
    <div class="ctl">
      <label>View as<select class="sel" id="role"></select></label>
      <label>Permission role<select class="sel" id="actrole"></select></label>
      <div><div class="small muted" style="margin-bottom:3px">Log sources</div><div class="chips" id="srcchips"></div></div>
    </div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="view"></div>
</div>
<aside class="sheet" id="sheet" hidden></aside>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
function h(t,a,...c){const e=document.createElement(t);if(a)for(const[k,v]of Object.entries(a)){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}for(const x of c.flat(Infinity))if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(String(x)));return e}
const fmt=(n)=>Number(n||0).toLocaleString('en');
const usd=(n)=>'$'+Number(n||0).toLocaleString('en',{minimumFractionDigits:n<10&&n>0?2:0,maximumFractionDigits:2});
const PRICE={'Claude Opus 5.5':30,'Claude Sonnet 5.5':9,'Claude Haiku 5.5':2,'GPT':10,'Copilot':10,'Gemini':7,'Hermes':3,'Other':8};
const MODELS=Object.keys(PRICE);
const KINDS=['agents','platforms','people','departments','connectors','sources','incidents','requests','alertRules'];
const DEFAULT_COMMS={enabled:true,blockSelfTalk:true,stopAckLoops:true,maxPerRecipient:3,maxPerDomain:5,windowMin:10,botSpeedSec:8,botSpeedTurns:3,onTrip:'freeze',smsFee:0.02,emailFee:0.002,
  owned:['sales@acmeops.com','support@acmeops.com','intake@acmeops.com','billing@acmeops.com','*@msgsndr.com','+15550101001','+15550101002'],
  blockedSenders:['noreply@*','no-reply@*','donotreply@*','mailer-daemon@*','postmaster@*'],
  ownedStormEnabled:true,maxOwnedMsgs:6,ownedWindowMin:10,ownedBotSpeedSec:8,ownedBotSpeedTurns:3,maxOwnedCostUsd:1.00};
const NEW_OWNED_AGG=()=>({recent:[],agents:[],agentIds:[],addresses:[],fastStreak:0,lastTs:0,lastAgent:'',spentUsd:0,tokens:0,frozen:false,reason:'',trippedAt:0,blockedCount:0,frozenThreadKeys:[]});
const S={audit:{},requests:{},alertRules:{},pol:{mode:'monitor',hourlyRate:45},roleMatrix:null,agents:{},platforms:{},people:{},departments:{},connectors:{},sources:{},incidents:{},cfg:{sameCall:5,maxCalls:20,maxRetries:3,onTrip:'stop',backoff:true},
  comms:JSON.parse(JSON.stringify(DEFAULT_COMMS)),threads:{},ownedAgg:NEW_OWNED_AGG(),commsStats:{checked:0,selfBlocked:0,ackStopped:0,pingPongTrips:0,blockedMsgs:0,savedUsd:0,ownedStormTrips:0},
  logs:[],runs:{},stats:{agent:{},person:{},dept:{},platform:{}},tab:'console',role:'all',actingRole:'',src:{demo:true,live:true},canWrite:true,db:null,local:false,filter:{agent:'',level:'all',platform:''},seq:0,sessionStart:Date.now(),loops:0};
const TABS=[['console','Live console'],['comms','Comms & ping-pong'],['agents','Agents'],['platforms','AI platforms'],['people','People & access'],['departments','Departments & policies'],['connectors','Connectors & vault'],['approvals','Approvals & alerts'],['cost','Cost & outcomes'],['audit','Audit trail'],['sources','Log sources']];

/* ---------- helpers ---------- */
const list=(k)=>Object.values(S[k]);
const vis=(dept)=>S.role==='all'||S.role===dept;
const can=(dept)=>S.canWrite&&(S.role==='all'||S.role===dept);
const byName=(k,n)=>list(k).find(x=>x.name===n);
function toast(m){const t=h('div',{class:'toast',role:'status'},m);document.body.append(t);setTimeout(()=>t.remove(),3200)}
function dbErr(e){toast(e&&e.code==='invalid_argument'?'Not saved. You may have view-only access.':'Not saved: '+(e&&e.message||'unavailable'))}
const timeStr=(t)=>new Date(t).toLocaleTimeString([], {hour12:false});
function afterHours(dept,t){const d=S.departments&&byName('departments',dept);if(!d||d.alwaysOn)return false;const dt=new Date(t);const day=dt.getDay();if(d.days==='Mon-Fri'&&(day===0||day===6))return true;const m=dt.getHours()*60+dt.getMinutes();const p=(s)=>{const[a,b]=(s||'0:0').split(':');return +a*60+ +b};return m<p(d.hoursStart||'08:00')||m>=p(d.hoursEnd||'18:00')}
const permanent=(e)=>/403|401|permission|forbidden|invalid|400|not found|404|denied/i.test(e||'');
const transient=(e)=>/timeout|429|503|502|rate|unavailable/i.test(e||'');
const ACTIONS=[['viewAll','See all departments'],['editOwn','Edit agents and people in own department'],['deployProd','Deploy agents to production'],['editPolicy','Edit department policies and budgets'],['editConnectors','Manage connectors and credentials'],['approve','Approve access requests'],['audit','View the audit trail']];
const ROLE_LIST=['Employee','Dept head','Back office','Admin'];
const ALL={viewAll:1,editOwn:1,deployProd:1,editPolicy:1,editConnectors:1,approve:1,audit:1};
const DEF_MATRIX={'Employee':{},'Dept head':{editOwn:1,approve:1,audit:1},'Back office':{...ALL},'Admin':{...ALL}};
S.roleMatrix=JSON.parse(JSON.stringify(DEF_MATRIX));
const actingRole=()=>S.actingRole||(S.role==='all'?'Back office':'Dept head');
const actor=()=>S.actingRole?S.actingRole+(S.role!=='all'?' ('+S.role+')':''):(S.role==='all'?'Back office':'Dept head ('+S.role+')');
const perm=(a)=>!!(S.roleMatrix[actingRole()]||{})[a];
const dim=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate(),dom=new Date().getDate();
const proj=(x)=>x*dim/dom;
const deptBase=(n)=>list('people').filter(p=>p.dept===n).reduce((a,p)=>a+(p.monthCost||0),0);
const deptMonth=(n)=>deptBase(n)+((S.stats.dept[n]||{}).cost||0);
const personMonth=(n)=>{const p=byName('people',n);return (p?p.monthCost||0:0)+((S.stats.person[n]||{}).cost||0)};
const agentMonth=(a)=>(a.monthCost||0)+((S.stats.agent[a.id]||{}).cost||0);
const SENSITIVE_FIELD_RE=/credential|secret|password|token|apikey|api_key|privatekey/i;
const shortV=(v,redact)=>{if(redact)return v==null||v===''?'(empty)':'(redacted)';const t=typeof v==='string'?v:JSON.stringify(v);return t==null?'':(t.length>40?t.slice(0,39)+'…':t)};
const diffOf=(o,n)=>!o?'created':(Object.keys(n).filter(k=>k!=='history'&&JSON.stringify(o[k])!==JSON.stringify(n[k])).map(k=>k+': '+shortV(o[k],SENSITIVE_FIELD_RE.test(k))+' → '+shortV(n[k],SENSITIVE_FIELD_RE.test(k))).join('; ')||'no changes');
function evaluate(a,when){
  if(!a)return '';
  const d=byName('departments',a.dept);
  if(d){
    if(d.models&&d.models.length&&!d.models.includes(a.model))return 'model '+a.model+' is not allowed for '+a.dept;
    const bad=(a.connectors||[]).find(c=>d.connectors&&d.connectors.length&&!d.connectors.includes(c));if(bad)return 'connector '+bad+' is not approved for '+a.dept;
    if(!d.alwaysOn&&a.schedule!=='24/7'&&afterHours(a.dept,when||Date.now()))return 'outside the department work period';
    if(d.hardCap&&d.budget&&deptMonth(d.name)>=d.budget)return 'department budget cap reached';
  }
  const p=byName('people',a.owner);if(p&&p.quota&&p.hardCap&&personMonth(p.name)>=p.quota)return 'owner quota reached';
  return '';
}
let locT;function saveLocal(){if(!S.local)return;clearTimeout(locT);locT=setTimeout(()=>{try{const snap={cfg:S.cfg,pol:S.pol,comms:S.comms,roleMatrix:S.roleMatrix,audit:S.audit};for(const k of KINDS)snap[k]=S[k];localStorage.setItem('acr_local_v1',JSON.stringify(snap))}catch(e){}},250)}
function audit(action,kind,target,detail,by){
  const rec={at:Date.now(),who:by||actor(),action,kind,target:target||'',detail:detail||''};
  const nid=S.db?S.db.collection('audit').doc().id:'x'+Date.now()+Math.random().toString(36).slice(2,5);
  S.audit[nid]={id:nid,...rec};if(S.db)S.db.doc('audit/'+nid).set(rec).catch(()=>{});else saveLocal();
}

/* ---------- comms & cross-agent ping-pong guard ---------- */
const COMMS_TOOLS=new Set(['send_email','send_sms','reply_ticket','send_outreach']);
const PUBLIC_DOMAINS=new Set(['gmail.com','googlemail.com','yahoo.com','outlook.com','hotmail.com','icloud.com','aol.com','proton.me','protonmail.com','live.com','msn.com']);
function normAddr(s){
  const t=String(s||'').trim().toLowerCase();if(!t)return '';
  if(!t.includes('@')&&!t.includes('*')&&/\d{7,}/.test(t.replace(/\D/g,'')))return '+'+t.replace(/\D/g,'');
  return t;
}
function matchAddr(addr,pat){
  const a=normAddr(addr),p=normAddr(pat);if(!a||!p)return false;
  if(!p.includes('*'))return a===p;
  const rx=new RegExp('^'+p.replace(/[.+?^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*')+'$','i');
  return rx.test(a);
}
const hitList=(addr,arr)=>addr?(arr||[]).find(p=>matchAddr(addr,p))||'':'';
function isSms(tool,to,ch){return ch==='sms'||tool==='send_sms'||(normAddr(to).startsWith('+')&&!String(to||'').includes('@'))}
function clusterInfo(to,contactId){
  const n=normAddr(to);
  if(contactId)return {key:'contact:'+String(contactId).toLowerCase(),label:'Contact '+contactId};
  if(n.includes('@')){const dom=n.split('@')[1];if(dom&&!PUBLIC_DOMAINS.has(dom))return {key:'domain:'+dom,label:'*@'+dom}}
  return {key:'addr:'+n,label:n||'unknown'};
}
const ACK_RE=/^(thanks!?|thank you[^?]*|got it[^?]*|will do[^?]*|sounds good[^?]*|received[^?]*|confirmed[^?]*|let me know if you need anything else[^?]*|have a (great|good|wonderful) (day|rest of your day|weekend)[^?]*|you('re| are) welcome[^?]*|out of (the )?office.*|automatic reply:.*|i am currently away.*)$/i;
const AUTO_HDR_RE=/auto-submitted:\s*auto-|x-auto-response-suppress|precedence:\s*(bulk|junk|auto)|x-controlroom-agent/i;
function isAckOnly(txt,hdr){
  if(hdr&&AUTO_HDR_RE.test(hdr))return 'auto-reply header ('+hdr.split(':')[0].trim()+')';
  const s=String(txt||'').trim();if(!s||s.includes('?'))return '';
  if(s.length<=140&&ACK_RE.test(s))return 'no-intent sign-off / auto-reply ("'+(s.length>42?s.slice(0,41)+'…':s)+'")';
  return '';
}
function checkCommsRule(args,tool){
  const c=S.comms;if(!c||!c.enabled)return null;
  const to=normAddr(args&&args.to),from=normAddr(args&&args.from);
  if(!to&&!from)return null;
  const ch=isSms(tool,to,args&&args.channel)?'sms':'email';
  const ci=clusterInfo(to||from,args&&args.contactId);
  const th=S.threads[ci.key];
  if(S.ownedAgg&&S.ownedAgg.frozen&&(hitList(to,c.owned)||hitList(from,c.owned)))
    return {block:true,flag:'owned storm frozen',layer:'Owned-identity storm breaker',why:'All automated outbound email/SMS touching your owned identities is frozen: '+S.ownedAgg.reason,ci,ch,to,from,self:true};
  if(th&&th.frozen)return {block:true,flag:'frozen thread',layer:'Frozen cluster',why:'Thread '+th.label+' is frozen ('+th.reason+')',ci,ch,to,from};
  if(c.blockSelfTalk){
    const oTo=hitList(to,c.owned),oFr=hitList(from,c.owned);
    if(oTo)return {block:true,flag:'self-talk',layer:'Owned identity list',why:'Self-talk blocked: outbound '+ch.toUpperCase()+' to owned identity '+to+' (matched '+oTo+')',ci,ch,to,from,self:true};
    if(oFr&&from)return {block:true,flag:'self-talk',layer:'Owned identity list',why:'Self-talk blocked: triggered by owned identity '+from+' (matched '+oFr+')',ci,ch,to,from,self:true};
  }
  const bHit=hitList(to,c.blockedSenders)||hitList(from,c.blockedSenders);
  if(bHit)return {block:true,flag:'bot blocklist',layer:'Bot blocklist',why:'Blocked automated/no-reply address (matched '+bHit+')',ci,ch,to,from,self:true};
  if(c.stopAckLoops){
    const ack=isAckOnly(args&&args.inbound,args&&args.headers);
    if(ack)return {block:true,flag:'ack stopped',layer:'Thank-you tennis filter',why:'Reply suppressed on '+ack,ci,ch,to,from,ack:true};
  }
  return {block:false,ci,ch,to,from};
}
function detectComms(ev){
  const c=S.comms;if(!c||!c.enabled)return;
  const isComms=COMMS_TOOLS.has(ev.tool)||!!(ev.args&&(ev.args.to||ev.args.channel==='sms'||ev.args.channel==='email'));
  if(!isComms||!(ev.args&&(ev.args.to||ev.args.from)))return;
  S.commsStats.checked++;
  const ch=isSms(ev.tool,ev.args.to,ev.args.channel)?'sms':'email';
  const fee=+(ch==='sms'?c.smsFee||0.02:c.emailFee||0.002);
  const estSaved=(ev.cost||0.03)+fee;
  const pre=checkCommsRule(ev.args,ev.tool);
  if(!pre)return;
  trackOwnedStorm(ev,pre.to,pre.from,ch,pre.block?0:+(ev.cost+fee).toFixed(4));
  if(pre.block){
    if(c.onTrip!=='warn'){ev.status='blocked';ev.error=pre.why;ev.tokens=0;ev.cost=0;S.commsStats.blockedMsgs++;S.commsStats.savedUsd+=estSaved}
    ev.flags.push(pre.flag);
    if(pre.self)S.commsStats.selfBlocked++;
    if(pre.ack)S.commsStats.ackStopped++;
    if(S.threads[pre.ci.key])S.threads[pre.ci.key].blockedCount=(S.threads[pre.ci.key].blockedCount||0)+1;
    if(S.tab==='comms')paintCommsLive();
    return;
  }
  ev.cost=+(ev.cost+fee).toFixed(4);
  const now=ev.ts||Date.now(),win=(c.windowMin||10)*60000;
  const th=S.threads[pre.ci.key]||(S.threads[pre.ci.key]={key:pre.ci.key,label:pre.ci.label,frozen:false,reason:'',trippedAt:0,recent:[],addresses:[],agents:[],agentIds:[],fastStreak:0,lastTs:0,lastAgent:'',fastestSec:null,spentUsd:0,tokens:0,blockedCount:0});
  th.recent=th.recent.filter(x=>now-x.ts<=win);
  let repSec=ev.args.replySec!=null?+ev.args.replySec:null;
  if(repSec==null&&th.lastTs&&now>=th.lastTs&&(now-th.lastTs)<=30000&&th.lastAgent&&th.lastAgent!==ev.agent)repSec=+((now-th.lastTs)/1000).toFixed(1);
  if(repSec!=null){
    if(th.fastestSec==null||repSec<th.fastestSec)th.fastestSec=repSec;
    th.fastStreak=repSec<=(c.botSpeedSec||8)?th.fastStreak+1:0;
  }
  th.lastTs=now;th.lastAgent=ev.agent;
  if(pre.to&&!th.addresses.includes(pre.to))th.addresses.push(pre.to);
  if(pre.from&&!th.addresses.includes(pre.from))th.addresses.push(pre.from);
  if(ev.agent&&!th.agents.includes(ev.agent))th.agents.push(ev.agent);
  if(ev.agentId&&ev.agentId!=='?'&&!th.agentIds.includes(ev.agentId))th.agentIds.push(ev.agentId);
  th.recent.push({ts:now,to:pre.to,from:pre.from,ch,agent:ev.agent});
  th.spentUsd+=ev.cost;th.tokens+=ev.tokens||0;
  const addrCount=pre.to?th.recent.filter(x=>x.to===pre.to).length:0;
  let why='';
  if(th.fastStreak>=(c.botSpeedTurns||3))why='Bot-speed ping-pong: '+th.fastStreak+' consecutive replies under '+c.botSpeedSec+'s across '+th.addresses.length+' address(es) ('+th.addresses.slice(0,4).join(', ')+')';
  else if(addrCount>(c.maxPerRecipient||3))why='Recipient velocity fuse: '+addrCount+' outbound messages to '+pre.to+' in '+c.windowMin+'m (limit '+c.maxPerRecipient+')';
  else if(th.recent.length>(c.maxPerDomain||5))why='Cross-email/SMS storm on '+th.label+': '+th.recent.length+' messages across '+th.addresses.length+' addresses ('+th.addresses.slice(0,4).join(', ')+') in '+c.windowMin+'m';
  if(!why)return;
  ev.flags.push('ping-pong');
  S.commsStats.pingPongTrips++;S.loops++;
  if(c.onTrip!=='warn'){
    th.frozen=true;th.reason=why;th.trippedAt=now;th.blockedCount++;
    th.spentUsd=Math.max(0,th.spentUsd-ev.cost);th.tokens=Math.max(0,th.tokens-(ev.tokens||0));
    ev.status='blocked';ev.error='comms guard: '+why;ev.tokens=0;ev.cost=0;
    S.commsStats.blockedMsgs++;S.commsStats.savedUsd+=estSaved;
  }
  const inc={at:Date.now(),kind:'comms',clusterKey:th.key,agentId:ev.agentId,agent:th.agents.join(' ↔ ')||ev.agent,dept:ev.dept,runId:ev.runId,reason:why,call:ev.tool+'('+shortArgs(ev.args)+')',calls:th.recent.length,cost:+th.spentUsd.toFixed(4),tokens:th.tokens,retryClass:'comms',action:c.onTrip==='halt'?'stop':c.onTrip==='freeze'?'freeze':'warn',status:'open'};
  saveDoc('incidents',null,inc,true,'System (comms guard)');
  if(c.onTrip==='halt'){for(const aid of th.agentIds){const ag=S.agents[aid];if(ag&&ag.status!=='halted')saveDoc('agents',ag.id,{...strip(ag),status:'halted',haltReason:why},true,'System (comms guard)')}}
  paintConsole();paintTabs();if(S.tab==='comms')paintCommsLive();
}
function unfreezeThread(key){
  const th=S.threads[key];if(!th)return;
  th.frozen=false;th.reason='';th.recent=[];th.fastStreak=0;
  audit('unfroze','comms',th.label,'Cleared frozen thread and reset velocity window');
  list('incidents').filter(i=>i.clusterKey===key&&i.status!=='resolved').forEach(i=>saveDoc('incidents',i.id,{...strip(i),status:'resolved'},true));
  paintTabs();render();toast('Unfroze '+th.label);
}

/* ---------- owned-identity storm breaker ----------
   Tracks ALL traffic touching any address/number on S.comms.owned as one combined
   group, independent of the per-contactId/per-domain clustering above. Four genuinely
   distinct owned identities (different numbers, different domains) would never share
   a clusterInfo() bucket, so without this they'd never be counted together. Always
   hard-stops (freeze + halt every involved agent) regardless of the general
   comms.onTrip setting - this one rule is intentionally not tunable to "warn only". */
function trackOwnedStorm(ev,to,from,ch,realCost){
  const c=S.comms;const agg=S.ownedAgg;
  if(!agg||!c.ownedStormEnabled||agg.frozen)return;
  if(!hitList(to,c.owned)&&!hitList(from,c.owned))return;
  const now=ev.ts||Date.now(),win=(c.ownedWindowMin||10)*60000;
  agg.recent=agg.recent.filter(x=>now-x.ts<=win);
  let repSec=ev.args&&ev.args.replySec!=null?+ev.args.replySec:null;
  if(repSec==null&&agg.lastTs&&now>=agg.lastTs&&(now-agg.lastTs)<=30000&&agg.lastAgent&&agg.lastAgent!==ev.agent)repSec=+((now-agg.lastTs)/1000).toFixed(1);
  if(repSec!=null)agg.fastStreak=repSec<=(c.ownedBotSpeedSec||8)?agg.fastStreak+1:0;
  agg.lastTs=now;agg.lastAgent=ev.agent;
  if(to&&!agg.addresses.includes(to))agg.addresses.push(to);
  if(from&&!agg.addresses.includes(from))agg.addresses.push(from);
  if(ev.agent&&!agg.agents.includes(ev.agent))agg.agents.push(ev.agent);
  if(ev.agentId&&ev.agentId!=='?'&&!agg.agentIds.includes(ev.agentId))agg.agentIds.push(ev.agentId);
  agg.recent.push({ts:now,to,from,ch,agent:ev.agent});
  agg.spentUsd+=realCost||0;agg.tokens+=ev.tokens||0;
  let why='';
  if(agg.recent.length>=(c.maxOwnedMsgs||6)&&agg.fastStreak>=(c.ownedBotSpeedTurns||3))
    why='Owned-identity storm: '+agg.recent.length+' messages across '+agg.addresses.length+' owned addresses ('+agg.addresses.slice(0,4).join(', ')+') with '+agg.fastStreak+' consecutive replies under '+(c.ownedBotSpeedSec||8)+'s';
  else if(agg.spentUsd>=(c.maxOwnedCostUsd||1))
    why='Owned-identity storm: combined spend reached '+usd(agg.spentUsd)+' across '+agg.addresses.length+' owned addresses in '+(c.ownedWindowMin||10)+'m';
  if(!why)return;
  tripOwnedStorm(ev,agg,why);
}
function tripOwnedStorm(ev,agg,why){
  agg.frozen=true;agg.reason=why;agg.trippedAt=Date.now();
  const frozenKeys=[];
  for(const[key,th]of Object.entries(S.threads)){if((th.addresses||[]).some(a=>hitList(a,S.comms.owned))){th.frozen=true;th.frozenByOwnedStorm=true;frozenKeys.push(key)}}
  agg.frozenThreadKeys=frozenKeys;
  ev.flags.push('owned-storm');
  S.commsStats.ownedStormTrips++;S.loops++;
  for(const aid of agg.agentIds){const ag=S.agents[aid];if(ag&&ag.status!=='halted')saveDoc('agents',ag.id,{...strip(ag),status:'halted',haltReason:why},true,'System (owned-storm guard)')}
  const inc={at:Date.now(),kind:'ownedStorm',clusterKey:'owned-all',agentId:ev.agentId,agent:agg.agents.join(' ↔ ')||ev.agent,dept:ev.dept,runId:ev.runId,reason:why,call:ev.tool+'('+shortArgs(ev.args)+')',calls:agg.recent.length,cost:+agg.spentUsd.toFixed(4),tokens:agg.tokens,retryClass:'ownedStorm',action:'stop',status:'open'};
  saveDoc('incidents',null,inc,true,'System (owned-storm guard)');
  paintConsole();paintTabs();if(S.tab==='comms')paintCommsLive();
}
function unfreezeOwnedStorm(){
  const agg=S.ownedAgg;if(!agg||!agg.frozen)return;
  for(const key of agg.frozenThreadKeys||[]){const th=S.threads[key];if(th&&th.frozenByOwnedStorm){th.frozen=false;th.frozenByOwnedStorm=false;th.reason='';th.recent=[];th.fastStreak=0}}
  S.ownedAgg=NEW_OWNED_AGG();
  audit('unfroze','comms','Owned-identity storm breaker','Cleared owned-identity storm freeze. Agents halted by this rule stay halted until resumed from the Agents tab.');
  list('incidents').filter(i=>i.kind==='ownedStorm'&&i.status!=='resolved').forEach(i=>saveDoc('incidents',i.id,{...strip(i),status:'resolved'},true));
  paintTabs();render();toast('Unfroze owned-identity storm breaker');
}

function bump(map,key,ev){const s=map[key]||(map[key]={calls:0,errors:0,blocked:0,tokens:0,cost:0,loops:0,last:0});s.calls++;if(ev.status==='error')s.errors++;if(ev.status==='blocked')s.blocked++;s.tokens+=ev.tokens||0;s.cost+=ev.cost||0;s.last=ev.ts;return s}
function resolveAgent(ev){return S.agents[ev.agentId]||byName('agents',ev.agent)||null}
function ingest(raw,detect,source){
  const ag=resolveAgent(raw);
  const ev={id:++S.seq,ts:raw.ts||Date.now(),agentId:ag?ag.id:(raw.agentId||'?'),agent:ag?ag.name:(raw.agent||raw.agentId||'unknown'),vt:raw.vt||0,dept:ag?ag.dept:(raw.dept||'—'),platform:ag?(ag.platform||'Unassigned'):(raw.platform||'Unassigned'),owner:ag?ag.owner:'',runId:raw.runId||('r-'+(raw.agentId||'x')),tool:raw.tool||'call',args:raw.args||{},status:raw.status||'ok',error:raw.error||'',out:raw.out||'',tokens:+raw.tokens||0,cost:raw.cost!=null?+raw.cost:((+raw.tokens||0)/1e6*(PRICE[ag&&ag.model]||9)),source:source||raw.source||'live',flags:[]};
  ev.vt=ev.vt||ev.ts;if(afterHours(ev.dept,ev.vt)&&!(ag&&ag.schedule==='24/7'))ev.flags.push('after hours');
  {const why=evaluate(ag,ev.vt);if(why&&ev.status!=='blocked'){ev.violation=why;ev.flags.push('policy')}}
  if(detect)detectComms(ev);
  S.logs.unshift(ev);if(S.logs.length>500)S.logs.pop();
  bump(S.stats.agent,ev.agentId,ev);if(ev.owner)bump(S.stats.person,ev.owner,ev);bump(S.stats.dept,ev.dept,ev);bump(S.stats.platform,ev.platform,ev);
  if(detect)detectLoop(ev);
  return ev;
}

/* ---------- loop detection ---------- */
function detectLoop(ev){
  if(ev.status==='blocked')return;
  const g=S.cfg;const R=S.runs[ev.runId]||(S.runs[ev.runId]={calls:0,sig:'',same:0,out:'',stall:0,errs:0,tripped:false,cost:0,tokens:0,agentId:ev.agentId,first:ev.ts});
  R.calls++;R.cost+=ev.cost;R.tokens+=ev.tokens;
  const sig=ev.tool+'('+JSON.stringify(ev.args)+')';const out=ev.status+':'+(ev.error||ev.out);
  if(sig===R.sig){R.same++;R.stall=out===R.out?R.stall+1:0;R.errs=ev.status==='error'?R.errs+1:0}
  else{R.same=1;R.stall=0;R.errs=ev.status==='error'?1:0}
  R.sig=sig;R.out=out;
  if(R.tripped)return;
  let why='';
  if(ev.status==='error'&&permanent(ev.error)&&R.errs>=2)why='Retried a non-retryable error ('+ev.error+')';
  else if(R.same>=g.sameCall&&R.stall>=g.sameCall-1)why='Same call made '+R.same+' times with an identical result, so no progress';
  else if(R.errs>g.maxRetries)why='Retry limit of '+g.maxRetries+' exceeded';
  else if(R.calls>g.maxCalls)why='Tool-call limit of '+g.maxCalls+' reached';
  if(!why)return;
  R.tripped=true;R.action=g.onTrip;ev.flags.push('loop');
  S.loops++;S.stats.agent[ev.agentId]&&S.stats.agent[ev.agentId].loops++;
  const ag=S.agents[ev.agentId];const dept=ag&&byName('departments',ag.dept);
  const inc={at:Date.now(),agentId:ev.agentId,agent:ev.agent,dept:ev.dept,runId:ev.runId,reason:why,call:sig,calls:R.calls,cost:+R.cost.toFixed(4),tokens:R.tokens,retryClass:permanent(ev.error)?'permanent':transient(ev.error)?'transient':'unknown',action:g.onTrip,notify:dept&&dept.head||'',status:g.onTrip==='escalate'?'needs human':'open'};
  saveDoc('incidents',null,inc,true,'System');
  if(g.onTrip==='stop'&&ag)saveDoc('agents',ag.id,{...strip(ag),status:'halted',haltReason:why},true,'System (loop guard)');
  paintConsole();paintTabs();
}
const strip=(o)=>{const c={...o};delete c.id;return c};

  Object.values(S.threads).filter(t=>t.frozen&&!t.frozenByOwnedStorm).forEach(t=>out.push({sev:'bad',rule:'Comms ping-pong',t:'Frozen thread: '+t.label,d:t.reason+' ('+(t.blockedCount||0)+' messages blocked)',at:t.trippedAt||now}));

function simTick(){

    else{r.n++;const roll=Math.random();

      else{const tl=tools[(r.n-1)%tools.length];const ca=COMMS_TOOLS.has(tl)?{to:'lead'+rnd(10,99)+'@client'+rnd(100,999)+'.com',channel:'email'}:{id:'X-'+rnd(1,99)};ev={ts:Date.now(),agentId:a.id,runId:r.id,tool:tl,args:ca,status:'ok',out:'rec '+rnd(1000,9999),tokens:tok};}

function applySeed(src){
  for(const k of KINDS){const m=src[k]||{};S[k]=Object.fromEntries(Object.entries(m).map(([id,d])=>[id,{id,...JSON.parse(JSON.stringify(d))}]))}
  if(src.cfg)Object.assign(S.cfg,src.cfg);
  if(src.pol)Object.assign(S.pol,src.pol);
  if(src.comms)S.comms=JSON.parse(JSON.stringify(src.comms));
  if(src.roleMatrix)S.roleMatrix=JSON.parse(JSON.stringify(src.roleMatrix));
  if(src.audit)S.audit=JSON.parse(JSON.stringify(src.audit));
}
function bootLocal(){
  S.local=true;S.canWrite=true;
  let saved=null;try{saved=JSON.parse(localStorage.getItem('acr_local_v1')||'null')}catch(e){}
  if(saved&&saved.departments&&Object.keys(saved.departments).length)applySeed(saved);
  else{applySeed(SEED);saveLocal()}
  const sub=$('#sub');
  sub.replaceChildren('Agents, people, departments, connectors, and email/SMS ping-pong protection. ',
    h('span',{class:'small'},'(Saved in browser · '),
    h('button',{class:'linkbtn',type:'button',onclick:()=>{localStorage.removeItem('acr_local_v1');S.threads={};S.commsStats={checked:0,selfBlocked:0,ackStopped:0,pingPongTrips:0,blockedMsgs:0,savedUsd:0};S.comms=JSON.parse(JSON.stringify(DEFAULT_COMMS));applySeed(SEED);saveLocal();paintRole();paintTabs();render();toast('Sample data reset')}},'Reset sample data'),
    h('span',{class:'small'},')'));
  paintRole();paintChips();paintTabs();render();
}

/* ---------- boot ---------- */
async function boot(){
  const hv=location.hash.slice(1);if(VIEWS[hv])S.tab=hv;
  paintRole();paintChips();paintTabs();render();
  setInterval(simTick,1000);
  setInterval(()=>{if(['agents','people','departments','approvals','cost'].includes(S.tab)){if($('#sheet').hidden&&!document.activeElement.closest('#view button'))render()}},6000);
  try{const user=await claude.use('user');if(user&&user.can){const w=user.can('data.write');if(w===false){S.canWrite=false}}}catch(e){}
  let db=null;try{db=await claude.use('db')}catch(e){}
  if(!db){bootLocal();return}
  S.db=db;
  for(const k of KINDS){db.collection(k).onSnapshot((snap)=>{S[k]=Object.fromEntries(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));if(k==='departments'||k==='people')paintRole();paintTabs();if(!($('#sheet').hidden)&&k!=='incidents')return;render()},()=>{})}
  db.doc('config/policy').onSnapshot((x)=>{if(x.exists)Object.assign(S.pol,x.data())},()=>{});
  db.doc('config/roles').onSnapshot((x)=>{if(x.exists&&x.data().m)S.roleMatrix=x.data().m},()=>{});
  db.doc('config/comms').onSnapshot((x)=>{if(x.exists)Object.assign(S.comms,x.data());if(S.tab==='comms'&&!document.activeElement.matches('#view input,#view select'))render()},()=>{});
  db.collection('audit').orderBy('at','desc').limit(200).onSnapshot((snap)=>{S.audit=Object.fromEntries(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));if(S.tab==='audit'&&!document.activeElement.matches('#view input'))render()},()=>{});
  db.doc('config/loop').onSnapshot((s)=>{if(s.exists)Object.assign(S.cfg,s.data());if(S.tab==='console'&&!document.activeElement.matches('#view input,#view select'))render()},()=>{});
  let first=true;
  db.collection('logs').orderBy('ts','desc').limit(150).onSnapshot((snap)=>{
    const ch=snap.docChanges().filter(c=>c.type==='added').map(c=>c.doc.data());
    ch.sort((a,b)=>new Date(a.ts)-new Date(b.ts));
    for(const d of ch){d.ts=new Date(d.ts).getTime()||Date.now();if(S.src.live)ingest(d,!first,'live')}
    first=false;paintConsole()},()=>{});
}
boot();
